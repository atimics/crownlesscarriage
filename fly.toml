app = "crownless-ratimics"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "tools/coop/Dockerfile"

[env]
  CROWNLESS_PUBLIC_ORIGIN = "https://crownless.ratimics.com"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "worlds"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
