name: Integrate Oven Court parser changes
on:
  push:
    branches: ['codex/silverwick-oven-court']
    paths: ['.github/workflows/integrate-oven.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/codex/silverwick-oven-court'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge the inspected main revision on this branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 819a88d94e7a3a09f6470707651345242db68924 || true
          python3 - <<'PY'
          import pathlib, subprocess
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed = {'tools/dialogue/fact_demo.py', 'tools/dialogue/fact_question.py'}
          assert set(conflicts) <= allowed, conflicts
          def version(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
          main = '819a88d94e7a3a09f6470707651345242db68924'
          question = 'tools/dialogue/fact_question.py'
          ours = version('HEAD', question)
          theirs = version(main, question)
          # Keep main's predicate parser, spoken-field exclusion and role checks.
          # Keep this PR's confidence validation and explicitly supplied acquisition.
          prefix = theirs[:theirs.index('def _certainty(')]
          acquisition = ours[ours.index('def _certainty('):ours.index('    facts = []')]
          tail = theirs[theirs.index('    facts = []'):]
          old = "'certainty': certainty, 'day': day, 'private': False"
          assert old in tail
          tail = tail.replace(old, "'certainty': certainty, 'confidence': confidence, 'day': day, 'private': False", 1)
          pathlib.Path(question).write_text(prefix + acquisition + tail)
          demo = 'tools/dialogue/fact_demo.py'
          text = version(main, demo)
          old = "facts = facts_from_fields(account['fields'], '1', event_id, account.get('confidence'), day=10)"
          new = "facts = facts_from_fields(account['fields'], '1', event_id, account.get('confidence'), day=10,\n                              source=account.get('source', 'told'))"
          assert text.count(old) == 1
          pathlib.Path(demo).write_text(text.replace(old, new, 1))
          PY
          git add tools/dialogue/fact_demo.py tools/dialogue/fact_question.py
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 tests/dialogue_fact_question_tests.py
          python3 tests/dialogue_fact_policy_tests.py
          python3 tools/language/model_identity.py --check
          rm .github/workflows/integrate-oven.yml
          git add --all
          git diff --cached --check
          git fetch origin codex/silverwick-oven-court
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git commit -m 'Merge main question predicates while preserving explicit evidence acquisition'
          git push origin HEAD:refs/heads/codex/silverwick-oven-court
