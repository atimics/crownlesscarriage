name: Town sky implementation workbench
on:
  push:
    branches: [feat/town-skies-and-backdrops]
    paths:
      - '.github/apply-town-sky.py'
      - '.github/workflows/town-sky-workbench.yml'
permissions:
  contents: read
concurrency:
  group: town-sky-implementation-workbench
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/feat/town-skies-and-backdrops'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare checksum-verified implementation commit
        run: |
          set -o pipefail
          mkdir -p out/sky-review
          python3 .github/apply-town-sky.py 2>&1 | tee out/sky-review/source-verification.log
          git diff --check
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git rm .github/apply-town-sky.py .github/workflows/town-sky-workbench.yml
          git add src/client/cc_local3d.c src/client/local3d tests/renderer_regression_tests.c tests/town_sky_tests.inc cmake/tests/80-client.cmake tools/capture_town_skies.py docs/design/town-skies.md .github/workflows/town-skies.yml
          git diff --cached --check
          git commit -m 'feat: integrate complete atmospheric skies and six world-anchored town horizons'
          git rev-parse HEAD > out/sky-review/tested-revision.txt
          git rev-parse HEAD^{tree} > out/sky-review/tested-tree.txt
      - name: Install native graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev libsqlite3-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev xvfb
      - name: Build complete native Release client and tests
        run: |
          set -o pipefail
          cmake -S . -B build-sky -DCMAKE_BUILD_TYPE=Release -DCC_WARNINGS_AS_ERRORS=ON -DCC_BUILD_GRAPHICS_PROBES=ON 2>&1 | tee out/sky-review/configure.log
          cmake --build build-sky --parallel 4 2>&1 | tee out/sky-review/build.log
      - name: Verify sky, ground cameras, movement and carriage contracts
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build-sky --output-on-failure --no-tests=error -R 'town_sky|distinct_local_places|local_collision_space|renderer|carriage|creature|travel|footing|town_arrival|town_departure|roadbook_arrival|oven_court|silverwick_mine|bridge_scene_input|capture_' 2>&1 | tee out/sky-review/tests.log
          xvfb-run -a ./build-sky/renderer_regression_tests --sky-graphics unused 2>&1 | tee out/sky-review/graphics.log
          xvfb-run -a ./build-sky/renderer_regression_tests --carriage-graphics unused 2>&1 | tee out/sky-review/carriage.log
      - name: Capture sixteen views, nine conditions and six moods in six settlements
        run: |
          xvfb-run -a python3 tools/capture_four_towns.py build-sky/crownless_carriage --output out/sky-review/towns --conditions
          xvfb-run -a python3 tools/capture_town_skies.py build-sky/renderer_regression_tests --output out/sky-review/moods
      - name: Publish only the tested implementation to its work branch
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git push origin HEAD:refs/heads/feat/town-skies-and-backdrops
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-sky-final-review
          path: |
            out/sky-review/
            build-sky/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: error
