name: Participant meaning 5M training

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps for the CPU run
        required: false
        default: '2500'
        type: string
  pull_request:
    paths:
      - '.github/workflows/dialogue-meaning-training.yml'
      - 'tools/dialogue/**'
      - 'tests/dialogue_semantic_training_tests.py'
      - 'assets/worldpacks/languages/**'
      - 'src/story/**'
      - 'src/sim/**'
      - 'src/rules/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: meaning-5m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tests/meaning_policy_tests.py
          python tests/meaning_language_tests.py
          python tests/meaning_data_tests.py
          python tests/dialogue_fact_policy_tests.py
          python tests/dialogue_fact_question_tests.py

  detect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.sources.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sources
        shell: bash
        run: |
          relevant=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            relevant=true
          else
            previous="$(git describe --tags --match 'v*.*.*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
            if [ -n "$previous" ] && ! git diff --name-only "$previous" "$GITHUB_SHA" | \
              python tools/dialogue/semantic_training_sources.py | grep -qx true; then
              relevant=false
            else
              relevant=true
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  train:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ZERO_COMMIT: 49e6bfedc6d91196e652d89309b23cafd8fc2ce9
      STEPS: ${{ inputs.steps || '2500' }}
    steps:
      - name: Checkout Crownless with release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record relevant source changes
        run: |
          previous="$(git describe --tags --match 'v*.*.*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git diff --name-status "$previous" "$GITHUB_SHA" > source-diff.txt
          else
            printf '%s\n' "No earlier release tag is available; this is the first release comparison." > source-diff.txt
          fi
          cat source-diff.txt
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/dialogue/requirements-semantic-training.txt
      - name: Checkout pinned ZERO source
        run: git clone --no-checkout https://github.com/atimics/zero.git zero
      - name: Pin ZERO commit
        working-directory: zero
        run: git checkout --detach "$ZERO_COMMIT"
      - name: Check dialogue event coverage
        run: |
          python tools/dialogue/audit_grammar.py --check
          python tests/meaning_policy_tests.py
          python tests/meaning_language_tests.py
          python tests/meaning_data_tests.py
          python tests/dialogue_fact_policy_tests.py
          python tests/dialogue_fact_question_tests.py
      - name: Train semantic model
        run: |
          case "$STEPS" in (*[!0-9]*|'') echo 'steps must be an integer from 1 to 6000' >&2; exit 1;; esac
          if [ "$STEPS" -lt 1 ] || [ "$STEPS" -gt 6000 ]; then
            echo 'steps must be an integer from 1 to 6000' >&2
            exit 1
          fi
          mkdir -p artifacts/meaning-5m
          timeout 40m python tools/dialogue/train_meaning.py \
            --zero "$GITHUB_WORKSPACE/zero" \
            --reference models/dialogue-syntax/model.ccv2 \
            --tokenizer assets/language/tokenizer.json \
            --output artifacts/meaning-5m/run \
            --worlds 1024 --steps "$STEPS" 2>&1 | tee artifacts/meaning-5m/training.log
      - name: Build native libraries
        run: |
          cmake -S . -B out/build/meaning-training -DCMAKE_BUILD_TYPE=Release \
            -DCC_BUILD_CLIENT=OFF -DCC_BUILD_GRAPHICS_PROBES=OFF
          cmake --build out/build/meaning-training --target crownless_story crownless_sim crownless_participant_probe crownless_food_relief_probe --parallel 2
      - name: Build native semantic probe
        run: |
          python tools/dialogue/build_syntax_probe.py \
            --model artifacts/meaning-5m/run/last.ccv2 \
            --build out/build/meaning-training \
            --output artifacts/meaning-5m/native
      - name: Require policy quality and exact native parity
        run: |
          python tools/dialogue/verify_semantic_training.py \
            --run artifacts/meaning-5m/run \
            --probe artifacts/meaning-5m/native/probe 2>&1 | tee artifacts/meaning-5m/gate.log
      - name: Verify food agreements and remembered outcomes
        run: |
          python tools/dialogue/verify_meaning_rollouts.py \
            --run artifacts/meaning-5m/run \
            --probe artifacts/meaning-5m/native/probe \
            --food-probe out/build/meaning-training/crownless_food_relief_probe \
            --participant-probe out/build/meaning-training/crownless_participant_probe
      - name: Upload failed run and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meaning-5m-run-${{ github.run_id }}
          path: |
            artifacts/meaning-5m
            source-diff.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meaning-5m-model-${{ github.run_id }}
          path: |
            artifacts/meaning-5m/run/last.ccv2
            artifacts/meaning-5m/run/manifest.json
            artifacts/meaning-5m/run/test-evaluation.json
            artifacts/meaning-5m/run/native-parity.json
            artifacts/meaning-5m/run/rollouts.json
          if-no-files-found: error
          retention-days: 90
