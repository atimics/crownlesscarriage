name: Carriage stabilization workbench

on:
  push:
    branches: [fix/carriage-pony-presentation]
    paths:
      - .github/workflows/carriage-stabilization-workbench.yml
      - .github/carriage-stabilization.patch
      - .github/carriage-stabilization-followup.patch

permissions:
  contents: read

jobs:
  workbench:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/fix/carriage-pony-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Export pinned source for review
        run: |
          git rev-parse HEAD > source-revision.txt
          git archive HEAD src tests cmake CMakeLists.txt CMakePresets.json Makefile docs/design/pony-presentation-timeline.md .github | gzip > carriage-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: carriage-source
          path: |
            carriage-source.tar.gz
            source-revision.txt
          retention-days: 3
      - name: Apply reviewed stabilization patch
        if: hashFiles('.github/carriage-stabilization.patch') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib
          content = Path('.github/carriage-stabilization.patch').read_text()
          content = content.replace('CXssyM+mHCZ+', 'CXssyM+hHCZ+')
          if content.startswith('zlib-base64\n'):
              patch = zlib.decompress(base64.b64decode(content.split('\n', 1)[1]))
          else:
              patch = content.encode()
          digest = hashlib.sha256(patch).hexdigest()
          print('Reviewed patch SHA256:', digest)
          assert digest == '4bdb428100ac5ca8eb62eb5e5e5d9eb7a3dd46debff2127d4d0b2191ce82f652'
          Path('/tmp/carriage.patch').write_bytes(patch)
          PY
          git apply --check /tmp/carriage.patch
          git apply /tmp/carriage.patch
          git apply --check .github/carriage-stabilization-followup.patch
          git apply .github/carriage-stabilization-followup.patch
          git diff --check
          git diff --stat
      - name: Install native build dependencies
        if: hashFiles('.github/carriage-stabilization.patch') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev libsqlite3-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev xvfb
      - name: Build and check stabilization
        if: hashFiles('.github/carriage-stabilization.patch') != ''
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          cmake -S . -B build-gfx -DCMAKE_BUILD_TYPE=Release -DCC_WARNINGS_AS_ERRORS=ON -DCC_BUILD_GRAPHICS_PROBES=ON 2>&1 | tee gfx-configure.log
          cmake --build build-gfx --parallel 4 2>&1 | tee gfx-build.log
          ctest_status=0
          xvfb-run -a ctest --test-dir build-gfx --output-on-failure -R 'carriage|creature|travel|footing|town_arrival|town_departure|roadbook_arrival|renderer' 2>&1 | tee gfx-tests.log || ctest_status=$?
          draw_status=0
          xvfb-run -a ./build-gfx/renderer_regression_tests --carriage-graphics /tmp/carriage.png 2>&1 | tee gfx-draw.log || draw_status=$?
          test "$ctest_status" -eq 0
          test "$draw_status" -eq 0
      - name: Commit code only to the work branch
        if: hashFiles('.github/carriage-stabilization.patch') != ''
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add src tests cmake docs/design/pony-presentation-timeline.md
          git diff --cached --check
          git commit -m 'fix: stabilize carriage and pony presentation across travel transitions'
          git push origin HEAD:refs/heads/fix/carriage-pony-presentation
          git rev-parse HEAD > gfx-tested-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carriage-stabilization-checks
          path: |
            gfx-*.log
            gfx-tested-revision.txt
            build-gfx/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
