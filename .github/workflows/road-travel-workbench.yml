name: Road travel workbench
on:
  push:
    branches: [feat/continuous-road-travel]
    paths: [.github/workflows/road-travel-workbench.yml]
permissions:
  contents: read
concurrency:
  group: continuous-road-workbench
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/feat/continuous-road-travel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare the checksum-verified implementation commit
        run: |
          mkdir -p out/travel/frames
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/road-travel-parts/{i:02d}.txt').read_text().strip() for i in range(6))
          assert len(encoded) == 38968, len(encoded)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 115052, len(patch)
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '99126d397e8a55ec2f5278e640cea05110cbfe2dec8509ea2bbe93c74e236c27', digest
          Path('out/travel/implementation.patch').write_bytes(patch)
          Path('out/travel/patch-sha256.txt').write_text(digest+'\n')
          PY
          git apply --check out/travel/implementation.patch
          git apply out/travel/implementation.patch
          git diff --check
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git rm -r .github/road-travel-parts .github/workflows/road-travel-workbench.yml
          git add src tests tools/coop/server.py web/coop_game.js cmake/tests/80-client.cmake docs/design/continuous-road-travel.md .github/workflows/continuous-road-travel.yml
          git diff --cached --check
          git commit -m 'feat: make road travel continuous with clear controls and coherent pony strides'
          git rev-parse HEAD > out/travel/revision.txt
          git rev-parse HEAD^{tree} > out/travel/tree.txt
          git diff HEAD^ HEAD --stat > out/travel/change-stat.txt
      - name: Install native review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev libsqlite3-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev xvfb ffmpeg
      - name: Clean native build and integration regressions
        run: |
          set -o pipefail
          ulimit -s 65536
          cmake -S . -B build-road -DCMAKE_BUILD_TYPE=Release -DCC_WARNINGS_AS_ERRORS=ON -DCC_BUILD_GRAPHICS_PROBES=ON 2>&1 | tee out/travel/configure.log
          cmake --build build-road --parallel 4 2>&1 | tee out/travel/build.log
          xvfb-run -a ctest --test-dir build-road --output-on-failure --no-tests=error -R 'continuous_road|travel|carriage|creature|daily_play_policy|native_shared|saved_road_position|roadside_camp|rainbow_pony|road_journey_save|road_encounter_session|distinct_local_places|local_collision_space|town_arrival|town_departure|roadbook_arrival|oven_court|silverwick_mine|renderer' 2>&1 | tee out/travel/tests.log
          xvfb-run -a build-road/renderer_regression_tests --road-gait 2>&1 | tee out/travel/stride-metrics.log
          xvfb-run -a build-road/renderer_regression_tests --carriage-graphics unused 2>&1 | tee out/travel/read-only-draw.log
          node tests/web_coop_tests.mjs 2>&1 | tee out/travel/browser-transport.log
          python3 tests/coop_tests.py build-road/libcrownless_coop.so 2>&1 | tee out/travel/shared-host.log
      - name: Record the production input sequence
        run: |
          set -o pipefail
          ulimit -s 65536
          xvfb-run -a build-road/crownless_carriage --capture-continuous-road "$PWD/out/travel/frames" 2>&1 | tee out/travel/capture.log
          ffmpeg -hide_banner -loglevel warning -y -framerate 15 -i out/travel/frames/frame-%03d.png -c:v libx264 -crf 20 -pix_fmt yuv420p out/travel/road-input.mp4
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('out/travel')
          frames = sorted((root/'frames').glob('frame-*.png'))
          assert len(frames) == 120, len(frames)
          (root/'manifest.json').write_text(json.dumps({
              'revision': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'capture': 'generated road departure; production Space/pointer input; eight seconds at 15fps',
              'files': [{'path':str(p.relative_to(root)), 'bytes':p.stat().st_size,
                         'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                        for p in [*frames, root/'road-input.mp4']]}, indent=2)+'\n')
          PY
      - name: Publish only the tested source to its work branch
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git push origin HEAD:refs/heads/feat/continuous-road-travel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-road-final-review
          path: |
            out/travel/
            build-road/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: error
