name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Cppcheck
        env:
          CPPCHECK_COMMIT: e73bf44c3e49686b7495fab352d03a6c6075516b
        run: |
          git clone --depth 1 --branch 2.21.0 \
            https://github.com/cppcheck-opensource/cppcheck.git \
            "$RUNNER_TEMP/cppcheck"
          test "$(git -C "$RUNNER_TEMP/cppcheck" rev-parse HEAD)" = \
            "$CPPCHECK_COMMIT"
          make -C "$RUNNER_TEMP/cppcheck" -j2 \
            MATCHCOMPILER=yes \
            FILESDIR="$RUNNER_TEMP/cppcheck" \
            CXXOPTS="-O2" CPPOPTS="-DNDEBUG"
      - name: Check for dead and repeated logic
        env:
          CC_CPPCHECK_EXECUTABLE: ${{ runner.temp }}/cppcheck/cppcheck
        run: make static-analysis

  assets:
    name: Shipped assets and shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked art inventory
        run: make art-assets-check
      - name: Check repository hygiene
        run: |
          scratch_files="$(find . -maxdepth 1 -type f -name '.merge_file_*' -print)"
          if [ -n "$scratch_files" ]; then
            printf 'Unexpected merge scratch files:\n%s\n' "$scratch_files"
            exit 1
          fi
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc
      - name: Test GLB corruption checks
        run: python3 tests/inspect_glb_tests.py
      - name: Validate shipped GLB assets
        run: |
          make blender-exports-check
          make blender-npc-assets-check
          make blender-creature-assets-check
          make blender-world-kit-check
          python3 tools/blender/validate_character_paint_channels.py
      - name: Compile shipped shaders
        run: |
          for shader in assets/shaders/*.vs; do
            glslc --target-env=opengl -fauto-map-locations \
              -fauto-bind-uniforms -fshader-stage=vertex \
              "$shader" -o "/tmp/$(basename "$shader").spv"
          done
          for shader in assets/shaders/*.fs; do
            glslc --target-env=opengl -fauto-map-locations \
              -fauto-bind-uniforms -fshader-stage=fragment \
              "$shader" -o "/tmp/$(basename "$shader").spv"
          done

  headless:
    name: Headless ${{ matrix.build_type }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCC_BUILD_CLIENT=OFF
          -DCC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Quick benchmark smoke test
        if: matrix.build_type == 'Release'
        run: ./build/crownless_benchmark --quick

  client:
    name: Full client / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux client development files
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgl1-mesa-dev libglu1-mesa-dev
          libsqlite3-dev libx11-dev libxcursor-dev libxext-dev
          libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev xvfb
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Launch macOS app smoke
        if: runner.os == 'macOS'
        run: >-
          ./build/crownless_carriage.app/Contents/MacOS/crownless_carriage
          --test-town-arrival-parking
      - name: Check road-book captures and render budgets
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: >-
          xvfb-run --auto-servernum
          cmake --build build --target run_roadbook_qa

      - name: Capture supported road-panel widths
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          for width in 1040 1200 1280; do
            xvfb-run --auto-servernum ./build/crownless_carriage \
              --capture-road-fork "road-fork-$width.png" "$width"
            test -s "road-fork-$width.png"
          done
      - name: Upload road-panel captures
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: road-panel-widths
          path: road-fork-*.png

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libsqlite3-dev libasound2-dev libgl1-mesa-dev libglu1-mesa-dev
          libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev
          libxinerama-dev libxrandr-dev xvfb
      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCC_BUILD_CLIENT=ON
          -DCC_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Check undefined behavior exits with failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang \
            -fsanitize=undefined \
            -fno-sanitize-recover=undefined \
            tests/sanitizer_ub_fixture.c \
            -o "$RUNNER_TEMP/sanitizer_ub_fixture"
          set +e
          "$RUNNER_TEMP/sanitizer_ub_fixture" \
            > sanitizer-self-check.log 2>&1
          fixture_status=$?
          set -e
          cat sanitizer-self-check.log
          test "$fixture_status" -ne 0
          grep -q "runtime error: signed integer overflow" \
            sanitizer-self-check.log
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build --output-on-failure \
            -E '^headless_performance_budget$' \
            2>&1 | tee sanitizer-tests.log
      - name: Capture the client under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run --auto-servernum ./build/crownless_carriage \
            --capture-opening sanitizer-opening.png \
            2>&1 | tee sanitizer-client.log
          test -s sanitizer-opening.png
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: |
            sanitizer-self-check.log
            sanitizer-tests.log
            sanitizer-client.log
            sanitizer-opening.png
          if-no-files-found: error
