name: Web game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Finish each running release; newer updates replace the single pending run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build WebAssembly game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: emcmake cmake --preset web
      - name: Build
        run: cmake --build --preset web
      - name: Check incremental asset refresh
        run: >-
          cmake
          -DCC_SOURCE_DIR=${{ github.workspace }}
          -DCC_BINARY_DIR=${{ github.workspace }}/out/build/web
          -P tests/web_incremental_asset_tests.cmake
      - name: Check site output
        run: >-
          test -f out/build/web/site/index.html &&
          test -f out/build/web/site/index.wasm &&
          test -f out/build/web/site/index.data &&
          test -f out/build/web/site/licenses.html &&
          test -f out/build/web/site/LICENSE.txt &&
          test -f out/build/web/site/THIRD_PARTY_NOTICES.txt &&
          test "$(stat -c%s out/build/web/site/index.data)" -le 10485760 &&
          test -f out/build/web/web-runtime/assets/exports/glb/carriage_base_v01.glb &&
          test -f out/build/web/site/assets/exports/glb/environment_bridge_checkpoint_v01.glb &&
          test -f out/build/web/site/assets/exports/glb/environment_market_granary_v01.glb &&
          test -f out/build/web/site/assets/exports/glb/environment_mine_entrance_v01.glb &&
          test -f out/build/web/site/assets/exports/glb/state_food_shortage_v01.glb &&
          test -f out/build/web/site/assets/exports/glb/state_harsh_enforcement_v01.glb &&
          test -f out/build/web/site/assets/exports/glb/state_market_recovery_v01.glb &&
          test -f out/build/web/site/assets/maps/gloamgate_to_alderwatch.png &&
          test -f out/build/web/site/assets/maps/collectible_map_atlas.png
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/crownless-browser" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/crownless-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test the built game in Chromium
        env:
          CC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/crownless-browser/node_modules/playwright
        run: node tests/browser_tests.cjs out/build/web/site browser-results
      - name: Build the shared carriage host
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          cmake -S . -B out/build/coop -DCC_BUILD_CLIENT=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/coop --target crownless_coop --parallel
          python3 -m venv out/build/coop/venv
          out/build/coop/venv/bin/python -m pip install -r tools/coop/requirements.txt
      - name: Test shared browser players
        env:
          CC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/crownless-browser/node_modules/playwright
          CC_COOP_PYTHON: out/build/coop/venv/bin/python
        run: node tests/coop_browser_tests.cjs out/build/coop/libcrownless_coop.so out/build/web/site
      - name: Test the shared world release container
        run: |
          node tests/coop_edge_tests.mjs
          docker build --file tools/coop/Dockerfile --build-arg CROWNLESS_REVISION="$GITHUB_SHA" --tag crownless-host-check .
          node tests/coop_host_tests.mjs crownless-host-check
      - name: Upload the shared world game
        uses: actions/upload-artifact@v4
        with:
          name: shared-world-game
          path: out/build/web/site
          include-hidden-files: true
      - name: Upload browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: browser-results
          if-no-files-found: ignore
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/build/web/site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-shared-world:
    name: Deploy shared world to Fly
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CROWNLESS_FLY_APP != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: shared-world-game
          path: out/build/web/site
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy the tested game and host
        env:
          FLY_API_TOKEN: ${{ secrets.CROWNLESS_FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --strategy immediate --build-arg CROWNLESS_REVISION="$GITHUB_SHA" --yes
      - name: Verify the live revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          for origin in ('https://crownless-ratimics.fly.dev', 'https://crownless.ratimics.com'):
              with urllib.request.urlopen(origin + '/healthz', timeout=30) as response:
                  health = json.load(response)
              assert health['status'] == 'ready', health
              assert health['revision'] == os.environ['EXPECTED_REVISION'], health
              print(origin + ' is healthy at the deployed revision.')
          PY
