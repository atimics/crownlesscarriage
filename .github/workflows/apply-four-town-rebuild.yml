name: Apply prepared four-town source edits

on:
  push:
    branches: [codex/four-authored-town-scenes]
    paths:
      - '.github/workflows/apply-four-town-rebuild.yml'
      - 'tools/apply_four_town_rebuild.py'

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/codex/four-authored-town-scenes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-checked source edits to this PR branch
        run: |
          python3 tools/apply_four_town_rebuild.py
          git diff --check
          git add -- src/client/cc_local_place.c src/client/local3d/authored_places.inc tests/local_place_tests.c tests/local_movement_tests.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compose sixteen authored town scenes and connect distinct building families'
          git push origin HEAD:refs/heads/codex/four-authored-town-scenes
