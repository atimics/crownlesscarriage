name: Towns and journey integration workbench
on:
  push:
    branches: [integration/towns-and-journey-cut]
    paths:
      - .github/workflows/towns-journey-workbench.yml
      - .github/towns-journey-workbench.py
permissions:
  contents: read
concurrency:
  group: towns-journey-workbench
  cancel-in-progress: true
jobs:
  integration:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/integration/towns-and-journey-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact integration inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, gzip
          output = Path('/tmp/town-inputs'); output.mkdir()
          refs = {'main': 'e69765e60a939143e6e14050331c735a530963df', 'towns': 'dbe44f532effeaf083e47378907b467180750899', 'oven': 'd1fb5c9aa6f39f0e6959e2050d5ff0b629b0c4d6'}
          for name in ('towns', 'oven'):
              base = subprocess.check_output(['git', 'merge-base', refs['main'], refs[name]], text=True).strip()
              refs[name + '-base'] = base
              (output / (name + '.diff')).write_bytes(subprocess.check_output(['git', 'diff', base, refs[name]]))
          for name, sha in refs.items():
              extra = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', sha, 'tools', 'docs/design'], text=True).splitlines()
              extra = [p for p in extra if Path(p).suffix in ('.py', '.c', '.cjs', '.js', '.md', '.sh')]
              paths = ['src', 'tests', 'cmake', '.github', 'CMakeLists.txt', 'CMakePresets.json', 'Makefile'] + extra
              data = subprocess.check_output(['git', 'archive', sha, *paths])
              with gzip.open(output / (name + '.tar.gz'), 'wb') as f: f.write(data)
          (output / 'revisions.txt').write_text('\n'.join(f'{name} {sha}' for name, sha in refs.items()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: town-integration-inputs
          path: /tmp/town-inputs/
          retention-days: 7
