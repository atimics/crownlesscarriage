name: Towns and journey integration workbench
on:
  push:
    branches: [integration/towns-and-journey-cut]
    paths:
      - .github/workflows/towns-journey-workbench.yml
      - .github/carriage-overview.patch
permissions:
  contents: read
concurrency:
  group: towns-journey-workbench
  cancel-in-progress: true
jobs:
  overview:
    if: github.repository == 'atimics/crownlesscarriage' && github.ref == 'refs/heads/integration/towns-and-journey-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the exact reviewed overview patch on its work branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib, base64, hashlib
          patch = zlib.decompress(base64.b64decode(Path('.github/carriage-overview.patch').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'a39a9ab9953d95d014e8f668a7dacfe18567fcabcc2d36e54d15cd6860b4e84e'
          Path('/tmp/overview.patch').write_bytes(patch)
          PY
          git checkout --detach c5589afee97710e199d40a380cb27f0fa1d830f6
          git apply --check /tmp/overview.patch
          git apply /tmp/overview.patch
          git diff --check
          mkdir -p out/overview
          cp /tmp/overview.patch out/overview/reviewed.patch
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev libsqlite3-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev xvfb
      - name: Build native client
        id: build
        run: |
          set -o pipefail
          cmake -S . -B build-overview -DCMAKE_BUILD_TYPE=Release -DCC_WARNINGS_AS_ERRORS=ON -DCC_BUILD_GRAPHICS_PROBES=ON 2>&1 | tee out/overview/configure.log
          cmake --build build-overview --parallel 4 2>&1 | tee out/overview/build.log
      - name: Exercise carriage, input and integration contracts
        run: |
          set -o pipefail
          ulimit -s 65536
          xvfb-run -a ctest --test-dir build-overview --output-on-failure --parallel 2 -R 'carriage|creature|travel|town|capture|mine|oven|adventure_input|adventure_trade|interaction' 2>&1 | tee out/overview/tests.log
      - name: Capture supported widths, large text, final rows and empty manifest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for width in 1040 1200 1280; do
            xvfb-run -a ./build-overview/crownless_carriage --capture-ux 31 "out/overview/manifest-$width.png" "$width" 0
          done
          xvfb-run -a ./build-overview/crownless_carriage --capture-ux 31 out/overview/manifest-large.png 1040 2
          xvfb-run -a ./build-overview/crownless_carriage --capture-ux 32 out/overview/manifest-end-large.png 1040 2
          xvfb-run -a ./build-overview/crownless_carriage --capture-ux 33 out/overview/manifest-empty.png 1040 0
      - name: Commit tested implementation only to the overview work branch
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add src/client/main.c src/client/cc_carriage_overview.inc src/client/cc_capture_request.inc src/client/cc_capture_request_tests.inc src/client/cc_capture_scenes.inc tests/carriage_overview_tests.inc cmake/tests/80-client.cmake
          git diff --cached --check
          git commit -m 'fix: keep the carriage manifest readable above departure controls'
          git push origin HEAD:refs/heads/fix/carriage-overview-layout
          git rev-parse HEAD > out/overview/tested-revision.txt
          git rev-parse HEAD^{tree} > out/overview/tested-tree.txt
      - name: Bundle review binaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tar -czf /tmp/overview-binaries.tar.gz build-overview/crownless_carriage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: carriage-overview-review
          path: |
            out/overview/
            build-overview/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: carriage-overview-native
          path: /tmp/overview-binaries.tar.gz
          retention-days: 7
