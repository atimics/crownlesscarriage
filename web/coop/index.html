<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>Crownless Carriage</title>
  <style>
    :root { color-scheme: dark; background: #0b0a09; color: #e8dfc9; font: 18px Georgia, serif; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; }
    main { text-align: center; }
    h1 { font-size: clamp(28px, 6vw, 48px); font-weight: normal; }
    a { display: inline-block; margin-top: 20px; padding: 18px 64px; color: #e8dfc9; border: 1px solid #9f8657; border-radius: 4px; text-decoration: none; }
    a:focus-visible, a:hover { background: #24211c; outline: 2px solid #9f8657; }
  </style>
</head>
<body>
  <main><h1>Crownless Carriage</h1><a id="start" href="/game/index.html">Start</a></main>
  <script>
    const fragment = new URLSearchParams(location.hash.slice(1));
    const world = fragment.get('world'), join = fragment.get('join');
    if (/^[a-f0-9]{32}$/.test(world || '')) document.querySelector('#start').href += '?world=' + world;
    else if (/^[a-f0-9]{32}\.[a-f0-9]{64}$/.test(join || '')) document.querySelector('#start').href += '#join=' + join;
  </script>
</body>
</html>
