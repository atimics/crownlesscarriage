<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171512">
    <title>Crownless Carriage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #171512;
        color: #e8dfc9;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 10%, #353027 0, #171512 52%),
          #171512;
      }
      main {
        width: min(100%, 1240px);
        padding: 18px 20px 28px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 500;
        letter-spacing: 0.05em;
      }
      p { margin: 4px 0 0; color: #aaa18e; }
      button {
        border: 1px solid #8e8168;
        border-radius: 3px;
        padding: 9px 13px;
        min-height: 44px;
        touch-action: manipulation;
        background: #24211c;
        color: #e8dfc9;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #302b24; }
      button:focus-visible, summary:focus-visible { outline: 2px solid #d3b576; outline-offset: 3px; }
      button:disabled { opacity: 0.5; cursor: default; }
      button[aria-pressed="true"] { border-color: #bca46f; background: #393123; }
      [hidden] { display: none !important; }
      .page-tools { display: flex; flex-wrap: wrap; gap: 8px; }
      #stage {
        position: relative;
        overflow: hidden;
        border: 1px solid #514a3d;
        border-radius: 4px;
        background: #0b0a09;
        box-shadow: 0 24px 70px rgb(0 0 0 / 45%);
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border: 0;
        outline: none;
        touch-action: none;
        background: #0b0a09;
      }
      #stage:fullscreen {
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }
      #stage:fullscreen canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #171512;
        color: #c9bea6;
        letter-spacing: 0.04em;
      }
      #loading[hidden] { display: none; }
      #progress {
        display: block;
        width: min(280px, 70vw);
        margin-top: 12px;
        accent-color: #9f8657;
      }
      #hint {
        margin-top: 10px;
        text-align: center;
        font: 0.82rem system-ui, sans-serif;
      }
      footer {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 8px;
        font: 0.76rem system-ui, sans-serif;
      }
      footer a { color: #a99b80; text-underline-offset: 0.2em; }
      footer a:hover { color: #e8dfc9; }
      footer a:focus-visible {
        outline: 2px solid #c7a96b;
        outline-offset: 3px;
        border-radius: 2px;
      }
      #touch-panel {
        padding: 16px;
        background: #201d18;
        font: 1rem/1.45 system-ui, sans-serif;
        min-width: 0;
        width: 100%;
        border-top: 1px solid #514a3d;
      }
      #touch-title { margin: 0; font: 1.3rem Georgia, serif; color: #dfc48c; }
      #touch-detail { margin: 8px 0 16px; color: #c5bba6; overflow-wrap: anywhere; }
      #touch-actions, .touch-keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      #touch-panel button { min-height: 48px; padding: 10px; overflow-wrap: anywhere; }
      #touch-shortcuts { margin-top: 16px; }
      #touch-panel summary { cursor: pointer; min-height: 44px; padding: 10px 0; color: #c5bba6; }
      #touch-reading { white-space: pre-line; color: #d4c9b3; overflow-wrap: anywhere; }
      .touch-mode #company-bar { position: static !important; flex-wrap: wrap; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)) !important; }
      .touch-mode #company-bar a { display: flex; align-items: center; min-height: 44px; }
      .touch-mode #company-bar span { flex: 1 1 130px; }
      #exit-fullscreen { display: none; position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); z-index: 2; }
      #stage:fullscreen #exit-fullscreen, #stage.expanded #exit-fullscreen { display: block; }
      body.expanded { overflow: hidden; }
      #stage.expanded { position: fixed; inset: 0; z-index: 10000; width: 100%; height: 100dvh; border: 0; border-radius: 0; display: grid; place-items: center; }
      #stage.expanded canvas { width: min(100vw, calc(100dvh * 16 / 9)); height: auto; }
      .touch-mode #stage:fullscreen, .touch-mode #stage.expanded {
        display: flex; flex-direction: column; justify-content: start;
        overflow-y: auto; padding: max(56px, env(safe-area-inset-top)) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .touch-mode #stage:fullscreen canvas, .touch-mode #stage.expanded canvas { width: 100%; height: auto; flex-shrink: 0; }
      .touch-mode #stage:fullscreen #touch-panel, .touch-mode #stage.expanded #touch-panel { width: 100%; }
      @media (max-width: 680px) {
        body { display: block; }
        main { padding: max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
        header { align-items: start; flex-direction: column; gap: 12px; }
        header p { display: none; }
        .page-tools { width: 100%; }
        .page-tools button { flex: 1; }
        footer { flex-wrap: wrap; }
        footer a { padding: 12px 4px; }
      }
      @media (min-width: 600px) and (max-height: 600px) and (orientation: landscape) {
        .touch-mode { display: block; }
        .touch-mode main { width: 100%; padding: 8px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); }
        .touch-mode header { margin-bottom: 8px; align-items: center; flex-direction: row; }
        .touch-mode .page-tools { width: auto; }
        .touch-mode .page-tools button { flex: initial; }
        .touch-mode header p, .touch-mode #hint, .touch-mode footer { display: none; }
        .touch-mode h1 { font-size: 1.1rem; }
        .touch-mode #stage, .touch-mode #stage:fullscreen, .touch-mode #stage.expanded {
          display: grid; grid-template-columns: minmax(0, 1fr) 250px; place-items: center;
          height: calc(100dvh - 70px - var(--company-bar-height, 0px)); overflow: hidden;
        }
        .touch-mode #stage:fullscreen, .touch-mode #stage.expanded { height: 100dvh; padding-top: 0; }
        .touch-mode #stage canvas { width: min(100%, calc((100dvh - 70px - var(--company-bar-height, 0px)) * 16 / 9)); height: auto; }
        .touch-mode #stage:fullscreen canvas, .touch-mode #stage.expanded canvas { width: min(100%, calc(100dvh * 16 / 9)); }
        .touch-mode #touch-panel { height: 100%; overflow-y: auto; overscroll-behavior: contain; border-top: 0; border-left: 1px solid #514a3d; padding: 12px; }
        .touch-mode #stage:fullscreen #touch-panel, .touch-mode #stage.expanded #touch-panel { padding-top: 60px; }
        .touch-mode #touch-actions { grid-template-columns: 1fr; }
      }
      body.avatar-preview {min-height:100vh;background:#1a2823;overflow:hidden}
      .avatar-preview main {padding:0;width:100%;height:100vh}
      .avatar-preview header,.avatar-preview #hint,.avatar-preview footer {display:none}
      .avatar-preview #stage {border:0;border-radius:0;box-shadow:none;height:100vh;display:grid;place-items:center;background:#1a2823}
      .avatar-preview canvas {width:100%;height:auto;background:#1a2823}
      .avatar-preview #loading {background:#1a2823}
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Crownless Carriage</h1>
          <p>A causal political action-RPG</p>
        </div>
        <div class="page-tools">
          <button id="touch-toggle" type="button" aria-pressed="false" aria-controls="touch-panel">Touch controls</button>
          <button id="fullscreen" type="button">Full screen</button>
        </div>
      </header>
      <div id="stage">
        <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
        <section id="touch-panel" aria-label="Game controls" hidden>
          <h2 id="touch-title">Preparing your journey…</h2>
          <p id="touch-detail">The game controls will appear here.</p>
          <div id="touch-actions"></div>
          <details id="touch-shortcuts" hidden>
            <summary>More controls</summary>
            <div class="touch-keys">
              <button type="button" data-key="69">Next target</button>
              <button type="button" data-key="70">Act</button>
              <button type="button" data-key="74">Jump</button>
              <button type="button" data-key="256">Back / menu</button>
              <button type="button" data-key="265">Previous</button>
              <button type="button" data-key="264">Next</button>
              <button type="button" data-key="257">Choose</button>
            </div>
          </details>
          <details id="touch-reading-panel" hidden>
            <summary>Scene details</summary>
            <p id="touch-reading"></p>
          </details>
        </section>
        <button id="exit-fullscreen" type="button">Exit full screen</button>
        <div id="loading" role="status">
          <div>
            <span id="status">Downloading the world…</span>
            <progress id="progress" value="0" max="100" hidden></progress>
          </div>
        </div>
      </div>
      <p id="hint">Choose Offline and Play. Esc opens the game menu. Saves stay in this browser.</p>
      <footer aria-label="Project information">
        <a href="licenses.html">Licenses &amp; credits</a>
        <a href="https://github.com/atimics/crownlesscarriage">Source</a>
      </footer>
    </main>
    <script>
      const canvas = document.querySelector("#canvas");
      const loading = document.querySelector("#loading");
      const statusElement = document.querySelector("#status");
      const progressElement = document.querySelector("#progress");

      var Module = {
        preRun: [],
        postRun: [function () {
          loading.hidden = true;
          if (Module.crownlessCampaignRestored && !Module.crownlessTouchEnabled) {
            document.querySelector("#hint").textContent =
              "Saved world ready. Choose Play to continue.";
          }
          if (!Module.crownlessTouchEnabled) canvas.focus({preventScroll: true});
        }],
        canvas,
        print: console.log.bind(console),
        printErr: console.error.bind(console),
        setStatus(text) {
          if (!text) {
            loading.hidden = true;
            return;
          }
          statusElement.textContent = text;
          const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
          if (match) {
            progressElement.hidden = false;
            progressElement.value = Number(match[1]);
            progressElement.max = Number(match[2]);
          }
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          this.setStatus(left
            ? `Preparing… (${this.totalDependencies - left}/${this.totalDependencies})`
            : "Starting…");
        }
      };

      Module.setStatus("Downloading the world…");
      window.addEventListener("error", function () {
        Module.setStatus("The game could not start. Check the browser console.");
      });
      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
        }
      });
      canvas.addEventListener("pointerdown", function () { canvas.focus({preventScroll: true}); });
      canvas.addEventListener("webglcontextlost", function (event) {
        event.preventDefault();
        Module.setStatus("The graphics context was lost. Reload the page to continue.");
      });
      const stage = document.querySelector("#stage");
      function leaveExpandedView() {
        stage.classList.remove("expanded");
        document.body.classList.remove("expanded");
      }
      async function toggleFullscreen() {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }
        if (stage.classList.contains("expanded")) { leaveExpandedView(); return; }
        if (stage.requestFullscreen && document.fullscreenEnabled) {
          try { await stage.requestFullscreen(); return; }
          catch { /* Use the page view when the browser declines fullscreen. */ }
        }
        stage.classList.add("expanded");
        document.body.classList.add("expanded");
      }
      document.querySelector("#fullscreen").addEventListener("click", toggleFullscreen);
      document.querySelector("#exit-fullscreen").addEventListener("click", toggleFullscreen);
      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && stage.classList.contains("expanded")) leaveExpandedView();
      });
    </script>
    <script src="assets.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
