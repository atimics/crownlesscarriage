<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171512">
    <title>Crownless Carriage</title>
    <style>
      :root { color-scheme: dark; background: #0b0a09; color: #e8dfc9; }
      * { box-sizing: border-box; }
      html, body, main, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #stage { display: grid; place-items: center; position: relative; }
      canvas {
        display: block; width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16)); border: 0; outline: none;
      }
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: #171512; font: 16px Georgia, serif;
      }
      #loading[hidden] { display: none; }
      #progress { display: block; width: min(280px, 70vw); margin-top: 12px; accent-color: #9f8657; }
      #company-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      button { border: 1px solid #8e8168; border-radius: 3px; background: #24211c; color: #e8dfc9; font: inherit; cursor: pointer; }
      [hidden] { display: none !important; }
      canvas { touch-action: none; }
      #stage.expanded { position: fixed; inset: 0; z-index: 10000; height: 100dvh; }
      .game-field { position: fixed; opacity: 0; margin: 0; padding: 0; font-size: 16px; border: 0; z-index: 2; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="canvas" aria-label="Crownless Carriage game" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
        <div id="loading" role="status">
          <div>
            <span id="status">Downloading the world…</span>
            <progress id="progress" value="0" max="100" hidden></progress>
          </div>
        </div>
      </div>
      <span id="company-status" role="status" aria-live="polite"></span>
    </main>
    <script>
      const canvas = document.querySelector("#canvas");
      const loading = document.querySelector("#loading");
      const statusElement = document.querySelector("#status");
      const progressElement = document.querySelector("#progress");

      var Module = {
        preRun: [],
        postRun: [function () {
          loading.hidden = true;
          canvas.focus();
        }],
        canvas,
        print: console.log.bind(console),
        printErr: console.error.bind(console),
        setStatus(text) {
          if (!text) {
            loading.hidden = true;
            return;
          }
          statusElement.textContent = text;
          const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
          if (match) {
            progressElement.hidden = false;
            progressElement.value = Number(match[1]);
            progressElement.max = Number(match[2]);
          }
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          this.setStatus(left
            ? `Preparing… (${this.totalDependencies - left}/${this.totalDependencies})`
            : "Starting…");
        }
      };

      Module.setStatus("Downloading the world…");
      window.addEventListener("error", function () {
        Module.setStatus("The game could not start. Check the browser console.");
      });
      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
        }
      });
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      canvas.addEventListener("webglcontextlost", function (event) {
        event.preventDefault();
        Module.setStatus("The graphics context was lost. Reload the page to continue.");
      });
      const stage = document.querySelector("#stage");
      function leaveExpandedView() {
        stage.classList.remove("expanded");
        document.body.classList.remove("expanded");
      }
      async function toggleFullscreen() {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }
        if (stage.classList.contains("expanded")) { leaveExpandedView(); return; }
        if (stage.requestFullscreen && document.fullscreenEnabled) {
          try { await stage.requestFullscreen(); return; }
          catch { /* Use the page view when the browser declines fullscreen. */ }
        }
        stage.classList.add("expanded");
        document.body.classList.add("expanded");
      }
      Module.toggleCrownlessFullscreen = toggleFullscreen;
      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && stage.classList.contains("expanded")) leaveExpandedView();
      });
    </script>
    <script src="assets.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
