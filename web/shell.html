<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171512">
    <title>Crownless Carriage</title>
    <style>
      :root { color-scheme: dark; background: #0b0a09; color: #e8dfc9; }
      * { box-sizing: border-box; }
      html, body, main, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; position: relative; }
      #game-frame { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
      canvas {
        display: block; width: min(100cqw, calc(100cqh * 16 / 9));
        height: min(100cqh, calc(100cqw * 9 / 16)); border: 0; outline: none;
      }
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: #171512; font: 16px Georgia, serif;
      }
      #loading[hidden] { display: none; }
      #progress { display: block; width: min(280px, 70vw); margin-top: 12px; accent-color: #9f8657; }
      #save-status {
        align-self: center; justify-self: stretch; margin: 6px 16px;
        max-width: min(460px, calc(100vw - 32px)); padding: 7px 10px;
        border: 1px solid #5b513f; border-radius: 3px; background: #171512e8;
        color: #e8dfc9; font: 14px Georgia, serif;
      }
      #save-status[data-state="failed"] { border-color: #b66b56; color: #ffd5ca; }
      #save-status[data-state="saving"] { border-color: #9f8657; }
      #company-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      button { border: 1px solid #8e8168; border-radius: 3px; background: #24211c; color: #e8dfc9; font: inherit; cursor: pointer; }
      [hidden] { display: none !important; }
      canvas { touch-action: none; }
      #stage.expanded { position: fixed; inset: 0; z-index: 10000; height: 100dvh; }
      .game-field { position: fixed; opacity: 0; margin: 0; padding: 0; font-size: 16px; border: 0; z-index: 2; }
      #touch-actions { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); z-index: 10001; }
      #touch-actions:focus-within { width: min(420px, calc(100vw - 24px)); height: auto; max-height: 50vh; overflow: auto; clip-path: none; right: 12px; bottom: 12px; padding: 12px; background: #171512; border: 1px solid #8e8168; z-index: 10001; }
      #touch-actions h2 { margin: 0 0 8px; font: 700 20px Georgia, serif; color: #f1d58a; }
      #touch-actions p { margin: 6px 0; line-height: 1.35; }
      .touch-reading { white-space: pre-line; }
      .touch-buttons { display: grid; gap: 8px; }
      .touch-buttons button { min-height: 44px; padding: 8px 12px; text-align: left; }
      .touch-scene-details { margin-top: 12px; }
      .touch-scene-details summary { min-height: 44px; padding: 10px 0; cursor: pointer; color: #d1bd8d; }
      @media (orientation: portrait) and (max-width: 600px) {
        #stage, #stage.expanded { grid-template-rows: auto minmax(0, 1fr) auto; }
        #game-frame { grid-row: 1; width: 100%; aspect-ratio: 16 / 9; }
        canvas {
          width: 100%;
          height: 100%;
        }
        #touch-actions, #touch-actions:focus-within {
          grid-row: 2;
          position: static;
          inset: auto;
          width: auto;
          height: auto;
          min-height: 0;
          max-height: none;
          overflow: auto;
          clip-path: none;
          padding: 14px 16px;
          border: 0;
          border-top: 1px solid #5b513f;
          border-bottom: 1px solid #5b513f;
          background: #171512;
          font: 16px Georgia, serif;
          z-index: 2;
        }
        #save-status { grid-row: 3; }
      }
      @media (orientation: landscape) and (min-width: 600px) and (max-width: 900px) and (max-height: 600px) {
        #stage { grid-template-columns: minmax(0, 1fr) minmax(260px, 38vw); grid-template-rows: minmax(0, 1fr) auto; }
        #game-frame { grid-column: 1; grid-row: 1; }
        #touch-actions, #touch-actions:focus-within {
          position: static;
          grid-column: 2;
          grid-row: 1;
          width: auto;
          height: 100%;
          min-width: 0;
          min-height: 0;
          max-height: 100%;
          overflow: auto;
          clip-path: none;
          padding: 10px;
          border-left: 1px solid #5b513f;
          background: #171512;
          font: 16px Georgia, serif;
          z-index: 2;
        }
        #touch-actions h2 { font-size: 18px; }
        .touch-buttons { gap: 6px; }
        #save-status { grid-column: 1 / -1; grid-row: 2; }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <div id="game-frame">
          <canvas id="canvas" aria-label="Crownless Carriage game" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
          <div id="loading" role="alert" aria-atomic="true" tabindex="-1">
            <div>
              <span id="status" role="status" aria-live="assertive">Downloading the world…</span>
              <progress id="progress" value="0" max="100" hidden></progress>
            </div>
          </div>
        </div>
        <div id="save-status" role="status" aria-live="polite" data-state="ready">Save status: preparing browser storage.</div>
      </div>
      <span id="company-status" role="status" aria-live="polite"></span>
    </main>
    <script>
      const canvas = document.querySelector("#canvas");
      const loading = document.querySelector("#loading");
      const statusElement = document.querySelector("#status");
      const progressElement = document.querySelector("#progress");
      const saveStatusElement = document.querySelector("#save-status");

      function showRecovery(text) {
        Module.crownlessRecoveryActive = true;
        progressElement.hidden = true;
        progressElement.value = 0;
        Module.setStatus(text);
        loading.focus();
      }

      var Module = {
        preRun: [],
        postRun: [function () {
          Module.crownlessRuntimeReady = true;
          if (!Module.crownlessRecoveryActive) loading.hidden = true;
          if (Module.crownlessRecoveryActive) loading.focus();
          else canvas.focus();
        }],
        canvas,
        print: console.log.bind(console),
        printErr: console.error.bind(console),
        setStatus(text) {
          if (!text) {
            if (!this.crownlessRecoveryActive) loading.hidden = true;
            return;
          }
          loading.hidden = false;
          statusElement.textContent = text;
          const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
          if (match) {
            progressElement.hidden = false;
            progressElement.value = Number(match[1]);
            progressElement.max = Number(match[2]);
          }
        },
        setCrownlessSaveStatus(text, state) {
          saveStatusElement.textContent = `Save status: ${text}`;
          saveStatusElement.dataset.state = state || "ready";
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          this.setStatus(left
            ? `Preparing… (${this.totalDependencies - left}/${this.totalDependencies})`
            : "Starting…");
        }
      };

      Module.setStatus("Downloading the world…");
      window.addEventListener("error", function () {
        showRecovery(Module.crownlessRuntimeReady
          ? "The game stopped after startup. Your browser state remains open. Check the browser console."
          : "The game could not start. Check the browser console.");
      });
      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.shiftKey &&
            event.key.toLowerCase() === "d" && Module.downloadCrownlessDiagnostics) {
          event.preventDefault();
          event.stopPropagation();
          Module.downloadCrownlessDiagnostics();
        }
      }, true);
      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
        }
      });
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      canvas.addEventListener("webglcontextlost", function (event) {
        event.preventDefault();
        showRecovery("The graphics context was lost. Reload the page to continue.");
      });
      const stage = document.querySelector("#stage");
      function leaveExpandedView() {
        stage.classList.remove("expanded");
        document.body.classList.remove("expanded");
      }
      async function toggleFullscreen() {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }
        if (stage.classList.contains("expanded")) { leaveExpandedView(); return; }
        if (stage.requestFullscreen && document.fullscreenEnabled) {
          try { await stage.requestFullscreen(); return; }
          catch { /* Use the page view when the browser declines fullscreen. */ }
        }
        stage.classList.add("expanded");
        document.body.classList.add("expanded");
      }
      Module.toggleCrownlessFullscreen = toggleFullscreen;
      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && stage.classList.contains("expanded")) leaveExpandedView();
      });
    </script>
    <script src="assets.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
